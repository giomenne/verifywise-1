databases:
  # PostgreSQL Database (Managed)
  - name: verifywise-database
    plan: free # Change to 'standard' or higher for production (starter plan no longer supported)
    databaseName: verifywise
    user: verifywise_user

services:
  # Redis (Managed)
  - type: redis
    name: verifywise-redis
    plan: free # Note: Redis may not have free tier, consider removing if not available
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Empty array allows all IPs (or specify specific IPs)

  # Backend API Service
  - type: web
    name: verifywise-backend
    env: node
    region: oregon # Change to your preferred region
    plan: free # Free tier available with limitations
    buildCommand: cd Servers && npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: cd Servers && NODE_ENV=production npm start
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DB_HOST
        fromDatabase:
          name: verifywise-database
          property: host
      - key: DB_USER
        fromDatabase:
          name: verifywise-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: verifywise-database
          property: password
      - key: DB_PORT
        fromDatabase:
          name: verifywise-database
          property: port
      - key: DB_NAME
        fromDatabase:
          name: verifywise-database
          property: database
      - key: DB_SSL
        value: true
      - key: REJECT_UNAUTHORIZED
        value: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: verifywise-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # You'll need to set this manually to your frontend URL
      - key: FAIRNESS_AND_BIAS_URL
        sync: false # Will be set automatically after bias-fairness service is deployed
      - key: MOCK_DATA_ON
        value: false
      # Email configuration - set these manually
      # - key: EMAIL_PROVIDER
      #   value: resend
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: EMAIL_ID
      #   sync: false
      # SMTP alternative:
      # - key: EMAIL_PROVIDER
      #   value: smtp
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   sync: false
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_SECURE
      #   value: true

  # Note: Worker removed - background jobs will run in the main backend service (via start.sh)
  # Workers are not available on free tier

  # Bias and Fairness Backend (Python/FastAPI)
  - type: web
    name: verifywise-bias-fairness
    env: python
    region: oregon # Should match backend region
    plan: free # Free tier available with limitations
    buildCommand: cd BiasAndFairnessServers && pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r src/requirements.txt
    startCommand: cd BiasAndFairnessServers/src && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      # Pydantic Settings will map DB_* env vars to db_* fields
      - key: DB_HOST
        fromDatabase:
          name: verifywise-database
          property: host
      - key: DB_USER
        fromDatabase:
          name: verifywise-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: verifywise-database
          property: password
      - key: DB_PORT
        fromDatabase:
          name: verifywise-database
          property: port
      - key: DB_NAME
        fromDatabase:
          name: verifywise-database
          property: database
      - key: REDIS_URL
        fromService:
          type: redis
          name: verifywise-redis
          property: connectionString
      - key: BACKEND_URL
        sync: false # Will be set to verifywise-backend URL after deployment

  # Frontend (Static Site)
  - type: web
    name: verifywise-frontend
    env: static
    buildCommand: cd Clients && npm install && npm run build
    staticPublishPath: ./Clients/dist
    envVars:
      - key: VITE_APP_API_BASE_URL
        sync: false # Will be set to backend URL after deployment
      - key: VITE_IS_DEMO_APP
        value: false
      - key: VITE_IS_MULTI_TENANT
        value: true
      - key: VITE_BRAND_NAME
        value: VerifyWise
      - key: VITE_SLACK_CLIENT_ID
        sync: false # Set if using Slack integration
      - key: VITE_SLACK_URL
        value: https://slack.com/oauth/v2/authorize
      - key: VITE_IS_SLACK_VISIBLE
        value: true